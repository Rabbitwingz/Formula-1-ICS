name: Update F1 calendar

on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build f1.ics
        run: python scripts/build_calendar.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1.ics state.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update F1 calendar"
            git push
          fi

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # During quiet spells (e.g. the off-season) an empty commit keeps the schedule alive.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            git commit --allow-empty -m "Keepalive: prevent GitHub pausing scheduled runs"
            git push
          else
            echo "Last commit is recent; no keepalive needed."
          fi
